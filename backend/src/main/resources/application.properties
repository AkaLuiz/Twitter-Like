
server.port = 8090

# Altera a estrutura da tabela caso a entidade tenha mudanças.
spring.jpa.hibernate.ddl-auto=update

# Acesso ao banco de dados
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/spring_react

# Usuário do banco de dados
spring.datasource.username=root

# Senha do banco de dados
spring.datasource.password=

# Chave usada para assinar os tokens JWT (troque por uma variável de ambiente em produção real)
app.jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-trocar-em-producao-0123456789abcdef}

# Tempo de validade do token, em milissegundos (24 horas)
app.jwt.expiracao-ms=86400000

# Pasta onde as fotos de perfil enviadas ficam salvas
app.upload.dir=${UPLOAD_DIR:uploads}

# Limite de tamanho pra upload de foto de perfil
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB